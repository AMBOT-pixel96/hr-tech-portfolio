name: Auto Universe Documentation v∞.1
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-universe-autodoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install nbformat

      - name: Write universe generator
        run: |
          cat > generate_universe_autodoc.py <<'PY'
          import pathlib, os, subprocess, datetime, collections, nbformat

          REPOS = [
              "AMBOT-pixel96/hr-tech-portfolio",
              "AMBOT-pixel96/python-fundamentals-lab",
              "AMBOT-pixel96/SQL-Fundamentals-Lab"
          ]

          ROOT = pathlib.Path('.').resolve()
          TMP = ROOT / "universe_tmp"
          TMP.mkdir(exist_ok=True)
          OUT_MD = ROOT / "MASTER_UNIVERSE_DOCUMENTATION.md"

          def run(cmd):
              subprocess.run(cmd, shell=True, check=True)

          def bytes_human(n):
              for u in ['B','KB','MB','GB']:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"

          master = [f"# 🌌 HR-Tech Universe Documentation — Full Source Edition",
                    f"_Generated {datetime.datetime.now():%Y-%m-%d %H:%M}_\n"]

          universe_deps = collections.Counter()
          universe_files = 0
          universe_size = 0

          for repo in REPOS:
              name = repo.split('/')[-1]
              local = TMP / name
              print(f"Cloning {repo}")
              run(f"git clone --depth 1 https://github.com/{repo}.git {local}")

              files = [p for p in local.rglob('*')
                       if p.is_file() and not any(x in p.parts for x in ['.git','__pycache__','venv'])]
              ext_counts = collections.Counter(p.suffix.lower().lstrip('.') or 'noext' for p in files)
              total_size = sum(p.stat().st_size for p in files)
              universe_files += len(files)
              universe_size += total_size

              master.append(f"\n---\n\n## 🌐 Repository: `{name}`")
              master.append(f"**Files:** {len(files)} **Size:** {bytes_human(total_size)}")
              master.append(f"\n### File-Type Counts\n{dict(ext_counts)}")

              # Directory tree
              master.append("\n### Directory Tree")
              for path in sorted(files, key=lambda p: p.as_posix()):
                  rel = path.relative_to(local)
                  master.append(f"- `{rel}` ({bytes_human(path.stat().st_size)})")

              # Full Code Catalogue & Dependency Scan
              master.append("\n### Code Catalogue & Dependencies (Full Source Included)")
              deps = collections.Counter()
              for p in files:
                  if p.suffix.lower() in ['.py', '.ipynb', '.sql', '.r', '.js', '.sh']:
                      rel = p.relative_to(local)
                      master.append(f"\n#### `{rel}`")
                      try:
                          if p.suffix.lower() == '.ipynb':
                              nb = nbformat.read(p, as_version=4)
                              cells = []
                              for cell in nb.cells:
                                  cells += cell.get('source', '').splitlines()
                              snippet = '\n'.join(cells)
                          else:
                              snippet = p.read_text(errors='ignore')
                              # dependency scan
                              for line in snippet.splitlines():
                                  if line.startswith('import '):
                                      mod = line.split()[1].split('.')[0]
                                      deps[mod] += 1
                                  elif line.startswith('from '):
                                      mod = line.split()[1].split('.')[0]
                                      deps[mod] += 1
                          lang = p.suffix.lstrip('.') or 'text'
                          master.append(f"```{lang}\n{snippet}\n```")
                      except Exception as e:
                          master.append(f"> *(Could not read {rel}: {e})*")
              if deps:
                  master.append("\n##### Dependency Map")
                  for k, v in deps.most_common():
                      master.append(f"- `{k}` ×{v}")
                  universe_deps.update(deps)

              # Datasets & Models
              data_exts = ['csv','xlsx','json','parquet']
              model_exts = ['pkl','joblib','h5','pt','pth']
              data = [p for p in files if p.suffix.lstrip('.').lower() in data_exts]
              models = [p for p in files if p.suffix.lstrip('.').lower() in model_exts]
              if data:
                  master.append("\n### Datasets")
                  for d in data:
                      master.append(f"- `{d.relative_to(local)}` ({bytes_human(d.stat().st_size)})")
              if models:
                  master.append("\n### Models")
                  for m in models:
                      master.append(f"- `{m.relative_to(local)}` ({bytes_human(m.stat().st_size)})")

          # Universe summary
          master.append("\n---\n# 🌍 Universe Summary")
          master.append(f"- **Repositories:** {len(REPOS)}")
          master.append(f"- **Total Files:** {universe_files}")
          master.append(f"- **Total Size:** {bytes_human(universe_size)}")
          master.append(f"- **Top Dependencies:**")
          for k, v in universe_deps.most_common(50):
              master.append(f"  - `{k}` ×{v}")

          OUT_MD.write_text('\n'.join(master), encoding='utf-8')
          PY

      - name: Run universe generator
        run: python generate_universe_autodoc.py

      - name: Commit Universe Docs
        uses: EndBug/add-and-commit@v9
        with:
          message: "🌌 Universe Autodoc v∞.1 update (full source + artifact)"
          add: "MASTER_UNIVERSE_DOCUMENTATION.md"
          push: origin main --force

      - name: Upload Universe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-autodoc
          path: MASTER_UNIVERSE_DOCUMENTATION.md