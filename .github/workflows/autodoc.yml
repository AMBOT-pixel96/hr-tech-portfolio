name: Auto Master Documentation
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      REPO_LIST:
        description: "Comma-separated list of extra repos (owner/repo). Leave blank for defaults."
        required: false
      PREVIEW_DATASETS:
        description: "true to include small dataset previews"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

jobs:
  build-autodoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tree pandoc texlive-xetex poppler-utils

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib nbformat pygments openpyxl python-dateutil

      - name: Write generator script
        run: |
          cat > generate_autodoc.py <<'PY'
          import pathlib, os, datetime, subprocess, collections, nbformat

          ROOT = pathlib.Path('.').resolve()
          OUT_MD = ROOT / "MASTER_DOCUMENTATION.md"
          OUT_PDF = ROOT / "MASTER_DOCUMENTATION.pdf"
          CHARTS = ROOT / "charts"
          CHARTS.mkdir(exist_ok=True)

          def run(cmd):
              subprocess.run(cmd, shell=True, check=True)

          def bytes_human(n):
              for u in ['B','KB','MB','GB']:
                  if n < 1024: return f"{n:.1f} {u}"
                  n /= 1024
              return f"{n:.1f} TB"

          # ---- SCAN REPO ----
          files = [p for p in ROOT.rglob('*')
                   if p.is_file() and not any(x in p.parts for x in ['.git','venv','__pycache__','charts'])]
          ext_counts = collections.Counter(p.suffix.lower().lstrip('.') or 'noext' for p in files)
          total_size = sum(p.stat().st_size for p in files)

          # ---- SUMMARY HEADER ----
          lines = []
          lines.append("# Master Documentation")
          lines.append(f"_Generated {datetime.datetime.now():%Y-%m-%d %H:%M}_\n")
          lines.append(f"**Total files:** {len(files)} **Total size:** {bytes_human(total_size)}")
          lines.append("\n## File Types\n")
          lines.append(str(dict(ext_counts)))

          # ---- DIRECTORY TREE ----
          lines.append("\n## Repository Tree\n")
          for p in sorted(ROOT.iterdir()):
              if p.is_dir():
                  lines.append(f"### 📂 {p.name}")
                  for sub in sorted(p.rglob('*')):
                      if sub.is_file():
                          rel = sub.relative_to(ROOT)
                          size = bytes_human(sub.stat().st_size)
                          lines.append(f"- `{rel}`  ({size})")

          # ---- NOTEBOOK & PY FILE HEADERS ----
          lines.append("\n## Code & Notebook Overview\n")
          for p in files:
              if p.suffix in ['.py','.ipynb']:
                  lines.append(f"### `{p}`")
                  try:
                      if p.suffix == '.py':
                          head = ''.join(open(p,encoding='utf-8').read().splitlines()[:10])
                      else:
                          nb = nbformat.read(p, as_version=4)
                          head = '\n'.join(c.get('source','') for c in nb.cells[:2])
                      lines.append("```python\n" + head[:600] + "\n```")
                  except Exception as e:
                      lines.append(f"> *(Could not preview: {e})*")

         # ---- SAVE ----
text = '\n'.join(lines)

# Escape LaTeX-sensitive characters to prevent pandoc crashes
def safe_for_latex(t):
    return (t.replace('\\', '\\\\')
            .replace('%', '\\%')
            .replace('&', '\\&')
            .replace('#', '\\#')
            .replace('_', '\\_')
            .replace('{', '\\{')
            .replace('}', '\\}')
            .replace('~', '\\textasciitilde{}')
            .replace('^', '\\textasciicircum{}'))

OUT_MD.write_text(text, encoding='utf-8')

try:
    safe_text = safe_for_latex(text)
    OUT_MD.write_text(safe_text, encoding='utf-8')
    run(f"pandoc {OUT_MD} -o {OUT_PDF} --pdf-engine=xelatex")
except Exception as e:
    print(f"⚠️ PDF generation failed: {e}")
    print('Markdown generated successfully, skipping PDF.')
          PY

      - name: Run generator
        run: python generate_autodoc.py

      - name: Commit generated docs
        uses: EndBug/add-and-commit@v9
        with:
          message: "🤖 Autodoc update"
          add: "MASTER_DOCUMENTATION.md MASTER_DOCUMENTATION.pdf charts"
          push: origin main --force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autodoc
          path: |
            MASTER_DOCUMENTATION.md
            MASTER_DOCUMENTATION.pdf
            charts/**