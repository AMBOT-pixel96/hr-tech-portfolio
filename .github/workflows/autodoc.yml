name: "Autodoc vMaxpossible (phone-friendly)"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      REPO_LIST:
        description: "Optional comma-separated list of other repos to include (owner/repo), or leave blank"
        required: false
      PREVIEW_DATASETS:
        description: "true to include tiny dataset previews"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  build-autodoc:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tree pandoc texlive-xetex poppler-utils  # poppler for PDFs if needed

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib nbformat pygments openpyxl python-dateutil

      - name: Write autodoc generator script
        run: |
          cat > generate_autodoc.py <<'PY'
#!/usr/bin/env python3
import os, sys, json, math, base64, subprocess, pathlib, datetime, shutil
from collections import Counter, defaultdict
import pandas as pd
import matplotlib.pyplot as plt
import nbformat

# Config
ROOT = pathlib.Path('.').resolve()
OUT_MD = ROOT / "MASTER_DOCUMENTATION.md"
OUT_PDF = ROOT / "MASTER_DOCUMENTATION.pdf"
CHARTS_DIR = ROOT / "charts"
PREVIEW_DATASETS = os.getenv('PREVIEW_DATASETS','false').lower() == 'true'
GITHUB_SERVER = os.getenv('GITHUB_SERVER_URL','https://github.com')
GITHUB_REPO = os.getenv('GITHUB_REPOSITORY')  # owner/repo
DEFAULT_BRANCH = 'main'
REPO_LIST_INPUT = os.getenv('REPO_LIST','').strip()

# Helpers
def run(cmd):
    return subprocess.check_output(cmd, shell=True, text=True)

def bytes_human(n):
    for unit in ['B','KB','MB','GB']:
        if n < 1024.0:
            return f"{n:3.1f} {unit}"
        n /= 1024.0
    return f"{n:.1f} TB"

# Gather file list
ignore_paths = ['.git', 'venv', '__pycache__', '.ipynb_checkpoints']
all_files = []
for p in ROOT.rglob('*'):
    if any(part in ignore_paths for part in p.parts): 
        continue
    if p.is_file():
        rel = p.relative_to(ROOT)
        all_files.append(rel.as_posix())

# Basic stats
total_files = len(all_files)
total_dirs = sum(1 for _ in ROOT.rglob('*') if _.is_dir() and not any(i in _.parts for i in ignore_paths))
total_size = sum(p.stat().st_size for p in ROOT.rglob('*') if p.is_file() and not any(i in p.parts for i in ignore_paths))
ext_counts = Counter([pathlib.Path(f).suffix.lower().lstrip('.') or 'noext' for f in all_files])

# Lines of code total (simple)
def count_lines(path):
    try:
        with open(path, 'rb') as fh:
            return sum(1 for _ in fh)
    except:
        return 0
total_loc = sum(count_lines(ROOT / f) for f in all_files if pathlib.Path(f).suffix.lower() in ['.py','.ipynb','.js','.java','.sh','.md','.r'])

# Folder-wise aggregation
folder_stats = defaultdict(lambda: {'files':0,'size':0,'exts':Counter()})
for f in all_files:
    p = ROOT / f
    folder = pathlib.Path(f).parent.as_posix()
    folder_stats[folder]['files'] += 1
    try:
        folder_stats[folder]['size'] += p.stat().st_size
    except:
        pass
    folder_stats[folder]['exts'][pathlib.Path(f).suffix.lower().lstrip('.') or 'noext'] += 1

# Model artifacts
model_exts = ['pkl','joblib','h5','onnx','pt','pth']
models = []
for f in all_files:
    ext = pathlib.Path(f).suffix.lower().lstrip('.')
    if ext in model_exts:
        p = ROOT / f
        models.append({
            'path': f,
            'size': bytes_human(p.stat().st_size),
            'modified': datetime.datetime.fromtimestamp(p.stat().st_mtime).isoformat()
        })

# Datasets
data_exts = ['csv','xlsx','parquet','json']
datasets = []
for f in all_files:
    ext = pathlib.Path(f).suffix.lower().lstrip('.')
    if ext in data_exts:
        p = ROOT / f
        datasets.append({'path': f, 'size': bytes_human(p.stat().st_size), 'ext': ext, 'modified': datetime.datetime.fromtimestamp(p.stat().st_mtime).isoformat()})

# Notebooks intelligence
notebooks = []
for f in all_files:
    if f.lower().endswith('.ipynb'):
        try:
            nb = nbformat.read(str(ROOT / f), as_version=4)
            cells = len(nb.cells)
            code_cells = sum(1 for c in nb.cells if c.cell_type == 'code')
            md_cells = sum(1 for c in nb.cells if c.cell_type == 'markdown')
            title = None
            # try to get first markdown heading
            for c in nb.cells:
                if c.cell_type == 'markdown' and c.source.strip():
                    lines = [L.strip() for L in c.source.splitlines() if L.strip()]
                    if lines:
                        title = lines[0][:120]
                        break
            notebooks.append({'path': f, 'cells': cells, 'code_cells': code_cells, 'md_cells': md_cells, 'title': title, 'modified': datetime.datetime.fromtimestamp((ROOT / f).stat().st_mtime).isoformat()})
        except Exception as e:
            notebooks.append({'path': f, 'cells': None, 'code_cells': None, 'md_cells': None, 'title': None, 'modified': datetime.datetime.fromtimestamp((ROOT / f).stat().st_mtime).isoformat()})

# Dependencies: requirements + import scan
deps = Counter()
req_file = ROOT / 'requirements.txt'
if req_file.exists():
    try:
        lines = req_file.read_text().splitlines()
        for l in lines:
            l = l.strip()
            if l and not l.startswith('#'):
                pkg = l.split('==')[0].split('>=')[0].strip()
                deps[pkg.lower()] += 1
    except:
        pass

# crude import scan across .py
for f in all_files:
    if f.endswith('.py'):
        try:
            text = (ROOT / f).read_text(errors='ignore')
            for line in text.splitlines():
                line = line.strip()
                if line.startswith('import '):
                    parts = line.split()
                    if len(parts) >= 2:
                        pkg = parts[1].split('.')[0]
                        deps[pkg.lower()] += 1
                elif line.startswith('from '):
                    parts = line.split()
                    if len(parts) >= 2:
                        pkg = parts[1].split('.')[0]
                        deps[pkg.lower()] += 1
        except:
            pass

# Charts: file-type distribution & top-10 largest files
CHARTS_DIR.mkdir(exist_ok=True)
# pie chart
labels = list(ext_counts.keys())
sizes = [ext_counts[k] for k in labels]
fig1, ax1 = plt.subplots(figsize=(6,4))
ax1.pie(sizes, labels=labels, autopct='%1.1f%%', startangle=90)
ax1.axis('equal')
pie_path = CHARTS_DIR / 'filetype_distribution.png'
fig1.savefig(pie_path, bbox_inches='tight')

# top 10 largest files
file_sizes = []
for f in all_files:
    try:
        s = (ROOT / f).stat().st_size
        file_sizes.append((f,s))
    except:
        pass
file_sizes.sort(key=lambda x: x[1], reverse=True)
topn = file_sizes[:10]
if topn:
    names = [p for p,_ in topn]
    sizes_mb = [s/1024/1024 for _,s in topn]
    fig2, ax2 = plt.subplots(figsize=(8,4))
    ax2.barh(list(reversed(names)), list(reversed(sizes_mb)))
    ax2.set_xlabel('Size (MB)')
    fig2.tight_layout()
    bar_path = CHARTS_DIR / 'top10_largest_files.png'
    fig2.savefig(bar_path, bbox_inches='tight')

# Build markdown
lines = []
lines.append(f"# 🧭 MASTER DOCUMENTATION — {GITHUB_REPO or ROOT.name}")
lines.append(f"_Auto-generated on {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}_\n")
# Cover (simple)
lines.append("## 📄 Executive Snapshot")
lines.append(f"- **Repo**: `{GITHUB_REPO or ROOT.name}`")
lines.append(f"- **Total files**: {total_files}")
lines.append(f"- **Total directories**: {total_dirs}")
lines.append(f"- **Total size**: {bytes_human(total_size)}")
lines.append(f"- **Total LoC (approx)**: {total_loc}")
lines.append("")

# TOC placeholder
lines.append("## 🔗 Table of Contents")
lines.append("1. [Repository Structure](#repository-structure)")
lines.append("2. [Repo Stats & Charts](#repo-stats--charts)")
lines.append("3. [Folder-wise Aggregation](#folder-wise-aggregation)")
lines.append("4. [File Index (with links)](#file-index)")
lines.append("5. [Code Previews](#code-previews)")
lines.append("6. [Model Artifacts](#model-artifacts)")
lines.append("7. [Datasets](#datasets)")
lines.append("8. [Notebooks Summary](#notebooks-summary)")
lines.append("9. [Dependency Map](#dependency-map)")
lines.append("")

# Repo structure
lines.append("## Repository Structure")
lines.append("```bash")
try:
    tree_txt = run("tree -a -I '.git|venv|__pycache__' -L 3")
except:
    tree_txt = "tree command unavailable"
lines.append(tree_txt)
lines.append("```")

# Repo Stats & Charts
lines.append("## Repo Stats & Charts")
lines.append(f"- File type counts: {dict(ext_counts)}")
lines.append(f"- Top charts: ")
if pie_path.exists():
    b64 = base64.b64encode(pie_path.read_bytes()).decode('ascii')
    lines.append(f"\n![filetype]({CHARTS_DIR.name}/filetype_distribution.png)\n")
if bar_path.exists():
    lines.append(f"\n![largest]({CHARTS_DIR.name}/top10_largest_files.png)\n")

# Folder-wise aggregation
lines.append("## Folder-wise Aggregation")
for folder,st in sorted(folder_stats.items(), key=lambda x: (-x[1]['files'], x[0]))[:200]:
    dominant = st['exts'].most_common(1)[0][0] if st['exts'] else ''
    lines.append(f"- **{folder or '.'}** — files: {st['files']}, size: {bytes_human(st['size'])}, dominant: {dominant}")

# File Index with GitHub links
lines.append("## File Index")
lines.append("| File | Size | Modified | Type |")
lines.append("|---|---:|---|---|")
for f in sorted(all_files):
    p = ROOT / f
    try:
        size = bytes_human(p.stat().st_size)
        mod = datetime.datetime.fromtimestamp(p.stat().st_mtime).strftime('%Y-%m-%d %H:%M')
    except:
        size = "-"
        mod = "-"
    ext = pathlib.Path(f).suffix.lower().lstrip('.') or 'noext'
    # build github link if possible
    if GITHUB_REPO:
        branch = os.getenv('GITHUB_REF_NAME', DEFAULT_BRANCH)
        url = f"{GITHUB_SERVER}/{GITHUB_REPO}/blob/{branch}/{f}"
        link = f"[`{f}`]({url})"
    else:
        link = f"`{f}`"
    lines.append(f"| {link} | {size} | {mod} | {ext} |")

# Code Previews (first N lines, fenced)
lines.append("\n## Code Previews")
MAX_SNIPPET_LINES = 8
for f in sorted(all_files):
    if f.endswith(('.py','.ipynb','.js','.sh','.R')):
        lines.append(f"<details><summary><b>{f}</b></summary>\n")
        ext = pathlib.Path(f).suffix.lower().lstrip('.')
        fence_lang = 'text'
        if ext == 'py': fence_lang = 'python'
        elif ext == 'ipynb': fence_lang = ''  # we'll display raw JSON head; better skip
        elif ext in ('js','ts'): fence_lang = 'javascript'
        elif ext in ('sh', 'bash'): fence_lang = 'bash'
        try:
            if f.endswith('.ipynb'):
                nb = nbformat.read(str(ROOT / f), as_version=4)
                preview = []
                for cell in nb.cells[:3]:
                    preview.append(f"# CELL TYPE: {cell.cell_type}\n")
                    for ln in (cell.source or "").splitlines()[:6]:
                        preview.append(ln)
                snippet = "\n".join(preview)
                lines.append("```")
                lines.append(snippet)
                lines.append("```")
            else:
                snippet = "\n".join((ROOT / f).read_text(errors='ignore').splitlines()[:MAX_SNIPPET_LINES])
                lines.append(f"```{fence_lang}")
                lines.append(snippet)
                lines.append("```")
        except Exception as e:
            lines.append("```")
            lines.append("Could not read file preview")
            lines.append("```")
        lines.append("</details>\n")

# Model artifacts
lines.append("## Model Artifacts")
if models:
    lines.append("| Path | Size | Modified |")
    lines.append("|---|---:|---|")
    for m in models:
        if GITHUB_REPO:
            branch = os.getenv('GITHUB_REF_NAME', DEFAULT_BRANCH)
            url = f"{GITHUB_SERVER}/{GITHUB_REPO}/blob/{branch}/{m['path']}"
            path_link = f"[`{m['path']}`]({url})"
        else:
            path_link = f"`{m['path']}`"
        lines.append(f"| {path_link} | {m['size']} | {m['modified']} |")
else:
    lines.append("_No model artifacts detected by extension._")

# Datasets
lines.append("## Datasets")
if datasets:
    lines.append("| Path | Size | Type | Modified | Preview |")
    lines.append("|---|---:|---|---|---|")
    for d in datasets:
        preview_txt = ""
        if PREVIEW_DATASETS and d['ext'] in ['csv','xlsx','json','parquet']:
            try:
                dp = ROOT / d['path']
                if d['ext'] == 'csv':
                    df = pd.read_csv(dp, nrows=3)
                elif d['ext'] == 'xlsx':
                    df = pd.read_excel(dp, nrows=3)
                elif d['ext'] == 'json':
                    df = pd.read_json(dp, lines=True, nrows=3)
                else:
                    df = None
                if df is not None:
                    preview_txt = "<br/>".join([", ".join(map(str,row)) for row in df.values.tolist()[:3]])
            except Exception as e:
                preview_txt = "preview_failed"
        if GITHUB_REPO:
            branch = os.getenv('GITHUB_REF_NAME', DEFAULT_BRANCH)
            url = f"{GITHUB_SERVER}/{GITHUB_REPO}/blob/{branch}/{d['path']}"
            path_link = f"[`{d['path']}`]({url})"
        else:
            path_link = f"`{d['path']}`"
        lines.append(f"| {path_link} | {d['size']} | {d['ext']} | {d['modified']} | {preview_txt} |")
else:
    lines.append("_No datasets detected._")

# Notebooks summary
lines.append("## Notebooks Summary")
if notebooks:
    lines.append("| Path | Cells | Code Cells | Markdown Cells | Title | Modified |")
    lines.append("|---|---:|---:|---:|---|---|")
    for n in notebooks:
        if GITHUB_REPO:
            branch = os.getenv('GITHUB_REF_NAME', DEFAULT_BRANCH)
            url = f"{GITHUB_SERVER}/{GITHUB_REPO}/blob/{branch}/{n['path']}"
            link = f"[`{n['path']}`]({url})"
        else:
            link = f"`{n['path']}`"
        lines.append(f"| {link} | {n.get('cells') or '-'} | {n.get('code_cells') or '-'} | {n.get('md_cells') or '-'} | { (n.get('title') or '-')[:80] } | {n.get('modified')} |")
else:
    lines.append("_No notebooks found._")

# Dependency Map
lines.append("## Dependency Map")
if deps:
    lines.append("| Package | Detected (count) |")
    lines.append("|---|---:|")
    for pkg, cnt in deps.most_common():
        lines.append(f"| `{pkg}` | {cnt} |")
else:
    lines.append("_No dependencies detected (no requirements.txt + import scan empty)._")

# Multi-repo (optional)
lines.append("## Multi-Repo Index (optional)")
if REPO_LIST_INPUT:
    repos = [r.strip() for r in REPO_LIST_INPUT.split(',') if r.strip()]
    for repo in repos:
        lines.append(f"### {repo}")
        lines.append(f"- Link: {GITHUB_SERVER}/{repo}")
        # shallow clone into /tmp to gather stats
        TMP = ROOT / 'tmp_repos'
        TMP.mkdir(exist_ok=True)
        safe_repo = repo.replace('/','_')
        try:
            clone_dir = TMP / safe_repo
            if clone_dir.exists():
                shutil.rmtree(clone_dir)
            # try clone with depth=1; supports public repos. For private, need PAT in env var PERSONAL_ACCESS_TOKEN
            token = os.getenv('PERSONAL_ACCESS_TOKEN')
            if token:
                repo_url = f"https://{token}@github.com/{repo}.git"
            else:
                repo_url = f"https://github.com/{repo}.git"
            run(f"git clone --depth 1 {repo_url} {clone_dir}")
            # count files
            cnt_files = sum(1 for _ in clone_dir.rglob('*') if _.is_file())
            size_bytes = sum(_.stat().st_size for _ in clone_dir.rglob('*') if _.is_file())
            lines.append(f"- Files: {cnt_files}, Size: {bytes_human(size_bytes)}")
        except Exception as ex:
            lines.append(f"- Could not clone / inspect repo (private or permission issue): {ex}")
else:
    lines.append("_No extra repos requested._")

# Footer
lines.append("\n---\n_This file is auto-generated by Autodoc vMaxpossible. No AI summaries, no external notifications._")

# Write out
OUT_MD.write_text("\n".join(lines), encoding='utf-8')
print("WROTE:", OUT_MD)

# Convert to PDF using pandoc (simple)
try:
    run(f"pandoc {OUT_MD} -o {OUT_PDF} --pdf-engine=xelatex")
    print("PDF created:", OUT_PDF)
except Exception as e:
    print("Pandoc -> PDF failed:", e)

PY

      - name: Run autodoc generator
        env:
          REPO_LIST: ${{ github.event.inputs.REPO_LIST || '' }}
          PREVIEW_DATASETS: ${{ github.event.inputs.PREVIEW_DATASETS || 'false' }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || '' }}
        run: |
          python generate_autodoc.py
          ls -lh MASTER_DOCUMENTATION.* || true
          ls -lh charts || true

      - name: Commit generated docs back to repo
        if: success()
        uses: EndBug/add-and-commit@v9
        with:
          message: "🤖 Autodoc vMaxpossible: update MASTER_DOCUMENTATION"
          add: "MASTER_DOCUMENTATION.md MASTER_DOCUMENTATION.pdf charts || true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: autodoc-artifacts
          path: |
            MASTER_DOCUMENTATION.md
            MASTER_DOCUMENTATION.pdf
            charts/**