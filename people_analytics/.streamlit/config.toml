[server]
headless = true
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"  # 🔥 disables auto file watcher to prevent inotify crashes

[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1E293B"
textColor = "#F9FAFB"
font = "sans serif"